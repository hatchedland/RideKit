# XcodeGen project definition. Generate the Xcode project with:  xcodegen generate
# (RideTracker.xcodeproj is generated, not committed.)
name: RideTracker

# "Personal" = Debug without iCloud, for running on your own iPhone with a free Apple ID
# (free Personal Teams can't sign apps that use iCloud). Use the "RideTracker (Personal)" scheme.
configs:
  Debug: debug
  Personal: debug
  Release: release

options:
  bundleIdPrefix: com.hatchedland
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # Set your Apple Developer Team ID here (or in Xcode › Signing & Capabilities).
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

fileGroups:
  - TestRoutes
  - PLAN.md
  - README.md

packages:
  RideKit:
    path: Packages/RideKit

targets:
  RideTracker:
    type: application
    platform: iOS
    sources:
      - path: RideTracker
      - path: Shared
    dependencies:
      - package: RideKit
      - target: RideTrackerWidgets
        embed: true
        codeSign: true
    info:
      path: RideTracker/Resources/Info.plist
      properties:
        CFBundleDisplayName: Ride Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - location-services
          - gps
        UIBackgroundModes:
          - location
          - remote-notification
        NSSupportsLiveActivities: true
        NSLocationWhenInUseUsageDescription: >-
          Ride Tracker uses your location to record your route and to save the spots you mark while
          riding, each with a Google Maps link.
        NSPhotoLibraryUsageDescription: >-
          Ride Tracker puts every photo and video you take during a ride into an album named after the
          ride, and uses their locations to show them at the spots where you took them.
        NSAppleMusicUsageDescription: >-
          Ride Tracker keeps a list of the songs you play in the Music app during a ride, so you can
          see and replay each ride's soundtrack.
        LSApplicationQueriesSchemes:
          - comgooglemaps
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatchedland.ridetracker
        # iCloud container iCloud.com.hatchedland.ridetracker + CloudKit + push (edit the file directly)
        CODE_SIGN_ENTITLEMENTS: RideTracker/Resources/RideTracker.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Ride Tracker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Personal:
          CODE_SIGN_ENTITLEMENTS: RideTracker/Resources/RideTracker-Personal.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG PERSONAL_TEAM

  RideTrackerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: RideTrackerWidgets
      - path: Shared
    info:
      path: RideTrackerWidgets/Info.plist
      properties:
        CFBundleDisplayName: Ride Tracker
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hatchedland.ridetracker.widgets
        TARGETED_DEVICE_FAMILY: "1"

  RideTrackerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: RideTrackerTests
    dependencies:
      - target: RideTracker
      - package: RideKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.hatchedland.ridetracker.tests

schemes:
  RideTracker (Personal):
    build:
      targets:
        RideTracker: all
    run:
      config: Personal
      simulateLocation:
        allow: true
    archive:
      config: Personal
  RideTracker:
    build:
      targets:
        RideTracker: all
        RideTrackerTests: [test]
    run:
      config: Debug
      simulateLocation:
        allow: true
        defaultLocation: TestRoutes/DelhiToMurthal.gpx
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - RideTrackerTests
        - package: RideKit/RideKitTests
