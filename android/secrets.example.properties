# Copy to secrets.properties (git-ignored) and fill in. Without values the app shows its
# "not set up" states instead of crashing, like the iOS build without Config/Secrets.xcconfig.

# Supabase project (Settings › API): host only, and the publishable key. Same project as iOS.
SUPABASE_HOST=YOUR_PROJECT.supabase.co
SUPABASE_PUBLISHABLE_KEY=

# Google Cloud › Credentials: the OAuth client of type "Web application" that Supabase's Google
# provider uses. Credential Manager asks Google for an ID token for this client.
GOOGLE_WEB_CLIENT_ID=

# Google Cloud › Credentials: the Android-restricted key (package com.hatchedland.ridetracker +
# signing SHA-1) for Maps SDK for Android, Places, Routes and Weather.
GOOGLE_MAPS_API_KEY=
